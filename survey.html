  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W4RWT1NTJB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-W4RWT1NTJB');

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #182F62;
      --cream: #eeeeee;
      --white: #ffffff;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--blue);
      color: var(--cream);
      font-family: 'Work Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 48px;
      border-bottom: 1px solid rgba(238,238,238,0.08);
    }

    .nav-logo img {
      height: 32px;
      width: auto;
      display: block;
    }

    .nav-back {
      font-family: 'Work Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(238,238,238,0.5);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .nav-back:hover { color: var(--cream); }

    .nav-back svg {
      width: 14px;
      height: 14px;
    }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 24px 80px;
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both 0.1s;
    }

    .survey-header {
      text-align: center;
      max-width: 560px;
      margin-bottom: 48px;
    }

    .eyebrow {
      font-family: 'Work Sans', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(238,238,238,0.45);
      margin-bottom: 20px;
    }

    .survey-header h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: clamp(22px, 4vw, 30px);
      letter-spacing: 0.04em;
      color: var(--cream);
      line-height: 1.25;
      margin-bottom: 16px;
    }

    .survey-header p {
      font-family: 'Work Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: rgba(238,238,238,0.55);
      line-height: 1.7;
    }

    .divider {
      width: 32px;
      height: 1px;
      background: rgba(238,238,238,0.2);
      margin: 0 auto 24px;
    }

    /* TALLY WRAPPER */
    .tally-wrapper {
      width: 100%;
      max-width: 680px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(238,238,238,0.08);
      border-radius: 4px;
      padding: 40px 48px;
    }

    .tally-wrapper iframe {
      display: block;
    }

    /* FOOTER */
    footer {
      padding: 20px 48px;
      border-top: 1px solid rgba(238,238,238,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    footer span {
      font-family: 'Work Sans', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(238,238,238,0.2);
    }

    /* ANIMATION */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      nav { padding: 20px 24px; }
      .tally-wrapper { padding: 24px 20px; }
      footer { padding: 20px 24px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">
      <img src="NOLUHOUSE_white.png" alt="NOLU House">
    </a>
    <a href="/" class="nav-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back
    </a>
  </nav>

  <main>
    <div class="survey-header">
      <p class="eyebrow">Member Survey</p>
      <div class="divider"></div>
      <h1>What if living longer and healthier was actually simple?</h1>
      <p>Help us shape NOLU House by sharing a few thoughts. It takes less than 3 minutes.</p>
    </div>

    <div class="tally-wrapper">
      <iframe
        data-tally-src="https://tally.so/embed/QKrXqp?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
        loading="lazy"
        width="100%"
        height="551"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        title="What if living longer and healthier was actually simple?">
      </iframe>
    </div>
  </main>

  <footer>
    <span>© 2025 NOLU House</span>
  </footer>

  <!-- Tally embed script -->
  <script>
    var d = document,
        w = "https://tally.so/widgets/embed.js",
        v = function() {
          "undefined" != typeof Tally
            ? Tally.loadEmbeds()
            : d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function(e) {
                e.src = e.dataset.tallySrc;
              });
        };
    if ("undefined" != typeof Tally) {
      v();
    } else if (d.querySelector('script[src="' + w + '"]') == null) {
      var s = d.createElement("script");
      s.src = w;
      s.onload = v;
      s.onerror = v;
      d.body.appendChild(s);
    }
  </script>

  <!-- GA event: track Tally form submission -->
  <script>
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'tally-form-submitted') {
        gtag('event', 'form_submit', {
          event_category: 'Survey',
          event_label: 'NOLU House Survey'
        });
      }
    });
  </script>

</body>
</html>
